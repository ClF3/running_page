name: running-page
services:
  runner:
    image: running-page-runner:${RUNNING_PAGE_IMAGE_TAG:-local}
    user: ${RUNNING_PAGE_CONTAINER_USER:-0:0}
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df}
        SOURCE_REVISION: ${RUNNING_PAGE_REVISION:-uncommitted}
        RUNNER_UID: ${RUNNING_PAGE_CONTAINER_UID:-1000}
        RUNNER_GID: ${RUNNING_PAGE_CONTAINER_GID:-1000}
    env_file:
      - ${RUNNING_PAGE_HOST_CONFIG:-/etc/running-page}/credentials.env
    environment:
      HOME: /tmp
      NODE_OPTIONS: --max-old-space-size=1024
      ROLLDOWN_WORKER_THREADS: '2'
      TOKIO_WORKER_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      GIT_TERMINAL_PROMPT: '0'
      GIT_SSH_COMMAND: ssh -i /config/github_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/config/known_hosts -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15
    volumes:
      - ${RUNNING_PAGE_HOST_STATE:-/var/lib/running-page}:/data
      - ${RUNNING_PAGE_HOST_CONFIG:-/etc/running-page}:/config:ro
      - ${RUNNING_PAGE_HOST_STATE:-/var/lib/running-page}/seed:/seed:ro
    cpus: 1.0
    cpuset: ${RUNNING_PAGE_CPUSET:-0}
    mem_limit: ${RUNNING_PAGE_MEMORY_LIMIT:-512m}
    memswap_limit: ${RUNNING_PAGE_MEMORY_SWAP_LIMIT:-2560m}
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
